<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Protótipo fictício de consulta de medicamentos em unidades do DF."
    />
    <script>
      (() => {
        try {
          const theme =
            localStorage.getItem("fcdf-theme") === "dark" ? "dark" : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
    <title>Farmácia Certa DF | Seu cuidado, mais simples</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>

  <body>
    <a class="skip" href="#content">Ir para o conteúdo</a>
    <header class="header">
      <div class="header-inner">
        <button
          class="brand"
          data-nav="inicio"
          aria-label="Farmácia Certa DF, início"
        >
          <span class="brand-mark">✚</span
          ><span
            >farmácia<span class="brand-second">certa</span
            ><small> DF</small></span
          >
        </button>
        <div class="desktop-search">
          <label class="sr-only" for="global-search">Buscar medicamento</label
          ><input
            id="global-search"
            placeholder="Qual medicamento você procura?"
            autocomplete="off"
          /><button
            class="iconbtn"
            id="voice-desktop"
            title="Busca por voz"
            aria-label="Buscar por voz"
          >
            <span data-icon="mic">🎙</span>
          </button>
        </div>
        <div class="header-actions">
          <button class="text-btn" id="read-toggle" type="button" aria-label="Ouvir texto da página">🔊 Ouvir</button>
          <button class="text-btn" id="font-decrease" type="button" aria-label="Diminuir texto">A−</button>
          <button
            class="text-btn theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Ativar modo noturno"
            aria-pressed="false"
          >
            🌙</button
          ><button
            class="text-btn"
            id="font-toggle"
            aria-label="Aumentar texto"
          >
            A+</button
          ><button
            class="text-btn account-shortcut"
            data-nav="acesso"
            aria-label="Minha conta"
          >
            ♙ Minha conta</button
          ><button class="text-btn admin-shortcut" data-nav="farmacia">
            Farmácia</button
          ><span class="demo-badge">SIMULAÇÃO</span>
        </div>
      </div>
    </header>
    <nav class="desktop-nav" aria-label="Navegação principal">
      <button data-nav="inicio">Início</button
      ><button data-nav="receitas">Minhas receitas</button
      ><button data-nav="acesso">Minha conta</button
      ><button data-nav="unidades">Unidades</button
      ><button data-nav="ajuda">Preciso de ajuda</button
      ><button data-nav="farmacia">Área da farmácia</button
      ><button data-nav="integracoes">Integrações</button>
    </nav>
    <main id="content" tabindex="-1" class="main"></main>
    <nav class="mobile-nav" aria-label="Navegação inferior">
      <button data-nav="inicio"><span data-icon="home">⌂</span>Início</button
      ><button data-nav="receitas"><span data-icon="prescription">▤</span>Receitas</button
      ><button data-nav="unidades"><span data-icon="hospital">▣</span>Unidades</button
      ><button data-nav="ajuda"><span data-icon="help">♧</span>Ajuda</button
      ><button data-nav="acesso"><span data-icon="account">♙</span>Conta</button>
    </nav>
    <footer>
      <div class="footer-inner">
        <b><span class="brand-mark small">✚</span> farmácia certa DF</b
        ><span
          >Protótipo de hackathon · estoques e horários simulados · não é um serviço
          oficial do SUS</span
        ><button class="link-btn" data-nav="sobre">Sobre e privacidade</button>
      </div>
    </footer>
    <div id="voice-status" class="voice-status" role="status" aria-live="polite" aria-atomic="true" hidden>
      <div class="voice-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <span id="voice-message">Ouvindo... pode falar o nome do remédio.</span>
      <button class="voice-stop" id="voice-stop" type="button" aria-label="Parar de ouvir">Parar</button>
    </div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script src="theme.js"></script>
    <script src="data.js"></script>
    <script src="icons.js"></script>
    <script src="med-search.js"></script>
    <script src="med-images.js"></script>
    <script src="app.js"></script>
  </body>
</html>
