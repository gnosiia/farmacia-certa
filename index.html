<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Protótipo fictício de consulta de medicamentos em unidades do DF."
    />
    <title>Farmácia Certa DF | Seu cuidado, mais simples</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>

  <body>
    <a class="skip" href="#content">Ir para o conteúdo</a>
    <header class="header">
      <div class="header-inner">
        <button
          class="brand"
          data-nav="inicio"
          aria-label="Farmácia Certa DF, início"
        >
          <span class="brand-mark">✚</span
          ><span
            >farmácia<span class="brand-second">certa</span
            ><small> DF</small></span
          >
        </button>
        <div class="desktop-search">
          <label class="sr-only" for="global-search">Buscar medicamento</label
          ><input
            id="global-search"
            placeholder="Qual medicamento você procura?"
            autocomplete="off"
          /><button
            class="iconbtn"
            id="voice-desktop"
            title="Busca por voz"
            aria-label="Buscar por voz"
          >
            ♩
          </button>
        </div>
        <div class="header-actions">
          <button
            class="text-btn theme-toggle"
            id="theme-toggle"
            type="button"
            aria-label="Ativar modo noturno"
            aria-pressed="false"
          >
            🌙</button
          ><button
            class="text-btn"
            id="font-toggle"
            aria-label="Aumentar ou diminuir texto"
          >
            Aa +</button
          ><button
            class="text-btn account-shortcut"
            data-nav="acesso"
            aria-label="Minha conta"
          >
            ♙ Minha conta</button
          ><button class="text-btn admin-shortcut" data-nav="farmacia">
            Farmácia</button
          ><span class="demo-badge">SIMULAÇÃO</span>
        </div>
      </div>
    </header>
    <nav class="desktop-nav" aria-label="Navegação principal">
      <button data-nav="inicio">Início</button
      ><button data-nav="receitas">Minhas receitas</button
      ><button data-nav="acesso">Minha conta</button
      ><button data-nav="unidades">Unidades</button
      ><button data-nav="ajuda">Preciso de ajuda</button
      ><button data-nav="farmacia">Área da farmácia</button
      ><button data-nav="integracoes">Integrações</button>
    </nav>
    <main id="content" tabindex="-1" class="main"></main>
    <nav class="mobile-nav" aria-label="Navegação inferior">
      <button data-nav="inicio"><span>⌂</span>Início</button
      ><button data-nav="receitas"><span>▤</span>Receitas</button
      ><button data-nav="unidades"><span>▣</span>Unidades</button
      ><button data-nav="ajuda"><span>♧</span>Ajuda</button
      ><button data-nav="acesso"><span>♙</span>Conta</button>
    </nav>
    <footer>
      <div class="footer-inner">
        <b><span class="brand-mark small">✚</span> farmácia certa DF</b
        ><span
          >Protótipo de hackathon · dados 100% fictícios · não é um serviço
          oficial do SUS</span
        ><button class="link-btn" data-nav="sobre">Sobre e privacidade</button>
      </div>
    </footer>
    <div id="toast" role="status" aria-live="polite"></div>
    <script>
      // Portão demonstrativo: não é autenticação real e não protege informações.
      try {
        if (sessionStorage.getItem("fcdf-demo-access") !== "yes")
          location.replace("login.html");
      } catch (e) {
        location.replace("login.html");
      }
    </script>
    <script src="theme.js"></script>
    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
